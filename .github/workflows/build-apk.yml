name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build-android:
    name: Build for Android
    # Явно указываем стабильную версию, чтобы избежать проблем с миграцией
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Buildozer global directory
        uses: actions/cache@v3
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-global-

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('buildozer.spec') }}
          restore-keys: gradle-

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          # Добавляем "yes |", чтобы автоматически согласиться с лицензиями
          command: yes | buildozer -v android debug
          buildozer_version: stable

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: health-tracker-apk
          path: bin/*.apk
